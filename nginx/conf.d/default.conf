upstream client {
    server client:80;
}

upstream api {
    server api:80;
}

upstream mongoexpress {
    server mongo-express:8081;
}

server {
    listen 80;
    server_name localhost;

    # Client Angular
    location / {
        proxy_pass http://client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # # Mongo Express
    location /mongoadmin/ {
        proxy_pass http://mongoexpress/mongoadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Segurança adicional
        # auth_basic "Administração do Banco";
        # auth_basic_user_file /etc/nginx/conf.d/htpasswd;
        
        # Configurações específicas para o Mongo-Express
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Needed for Mongo Express to work properly
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /mongoadmin;
        
        # Reescreve os conteúdos das respostas
        # proxy_redirect / /mongoadmin/;
        # sub_filter_once off;
        # sub_filter_types *;
        # sub_filter 'href="/' 'href="/mongoadmin/';
        # sub_filter 'src="/' 'src="/mongoadmin/';
        # sub_filter 'url("/' 'url("/mongoadmin/';
        # sub_filter "url('/" "url('/mongoadmin/";
        # sub_filter 'action="/' 'action="/mongoadmin/';
    }
}